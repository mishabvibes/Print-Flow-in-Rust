[package]
name = "forge-studio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Forge Studio desktop application"

[[bin]]
name = "forge-studio"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
forge-engine = { workspace = true }
forge-format = { workspace = true }
forge-image = { workspace = true }
forge-ui-egui = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "glow", "x11", "wayland"] }
rfd = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
